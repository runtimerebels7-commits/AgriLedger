
{% extends "base.html" %}

{% block title %}Login | AgriLedger{% endblock %}

{% block content %}

<section class="auth-container">

    <div class="auth-card">

        <span class="eyebrow" data-i18n="login_welcome">
            WELCOME BACK
        </span>

        <h1 data-i18n="login_heading">
            Login to AgriLedger
        </h1>

        <p data-i18n="login_description">
            Access your agricultural transactions.
        </p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">

            <label for="loginPhone" data-i18n="mobile_number">
                Mobile Number
            </label>

            <input
                type="tel"
                id="loginPhone"
                name="phone"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="Enter 10-digit mobile number"
                data-i18n-placeholder="phone_placeholder"
                required
            >

            <label for="loginPassword" data-i18n="password">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter password"
                data-i18n-placeholder="password_placeholder"
                required
            >

            <label for="loginRole" data-i18n="select_portal">
                Select Portal
            </label>

<select name="role" id="loginRole" required>
    <option value="farmer" data-i18n="farmer_portal_option">
        Farmer Portal
    </option>

    <option value="buyer" data-i18n="buyer_portal_option">
        Buyer Portal
    </option>

    <option value="admin" data-i18n="admin_portal_option">
        Admin Portal
    </option>
</select>


            <button type="submit"
                    class="btn btn-green full"
                    data-i18n="login_button">

                Login →

            </button>

        </form>

        <p class="auth-bottom">

            <span data-i18n="no_account">
                Don't have an account?
            </span>

            <a href="/register" data-i18n="register_here">
                Register here
            </a>

        </p>

    </div>

</section>

{% endblock %}
