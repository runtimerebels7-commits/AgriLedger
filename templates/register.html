
{% extends "base.html" %}

{% block title %}Register | AgriLedger{% endblock %}

{% block content %}

<section class="auth-container">

    <div class="auth-card">

        <span class="eyebrow" data-i18n="register_eyebrow">
            JOIN AGRILEDGER
        </span>

        <h1 data-i18n="register_heading">
            Create Your Account
        </h1>

        <p data-i18n="register_description">
            Register as a farmer or buyer.
        </p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">

            <!-- ACCOUNT TYPE -->

            <label for="registerRole" data-i18n="account_type">
                Account Type
            </label>

            <select name="role" id="registerRole" required>

                <option value="farmer" data-i18n="farmer_option">
                    Farmer
                </option>

                <option value="buyer" data-i18n="buyer_option">
                    Buyer
                </option>

            </select>


            <!-- FULL NAME -->

            <label for="registerUsername" data-i18n="full_name">
                Full Name
            </label>

            <input
                type="text"
                id="registerUsername"
                name="username"
                placeholder="Enter your name"
                data-i18n-placeholder="name_placeholder"
                required
            >


            <!-- MOBILE NUMBER -->

            <label for="registerPhone" data-i18n="mobile_number">
                Mobile Number
            </label>

            <input
                type="tel"
                id="registerPhone"
                name="phone"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="10-digit mobile number"
                data-i18n-placeholder="register_phone_placeholder"
                required
            >


            <!-- PASSWORD -->

            <label for="registerPassword" data-i18n="password">
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                name="password"
                minlength="8"
                placeholder="Create password"
                data-i18n-placeholder="create_password_placeholder"
                required
            >


            <!-- PREFERRED LANGUAGE -->

            <label for="preferredLanguage" data-i18n="preferred_language">
                Preferred Language
            </label>

            <select name="language" id="preferredLanguage" required>

                <option value="kn-IN">ಕನ್ನಡ</option>
                <option value="hi-IN">हिन्दी</option>
                <option value="ta-IN">தமிழ்</option>
                <option value="te-IN">తెలుగు</option>
                <option value="ml-IN">മലയാളം</option>
                <option value="en-IN">English</option>
                <option value="mr-IN">मराठी</option>
                <option value="bn-IN">বাংলা</option>

            </select>


            <!-- FARMER DETAILS -->

            <div id="farmerFields">

                <label for="registerLocation" data-i18n="village_district">
                    Village / District
                </label>

                <input
                    type="text"
                    id="registerLocation"
                    name="location"
                    placeholder="Enter your location"
                    data-i18n-placeholder="location_placeholder"
                >

            </div>


            <!-- BUYER DETAILS -->

            <div id="buyerFields" class="hidden">

                <label for="businessName" data-i18n="business_name">
                    Business Name
                </label>

                <input
                    type="text"
                    id="businessName"
                    name="business_name"
                    placeholder="Enter business name"
                    data-i18n-placeholder="business_placeholder"
                >

            </div>


            <!-- CREATE ACCOUNT -->

            <button type="submit"
                    class="btn btn-green full"
                    data-i18n="create_account">

                Create Account →

            </button>

        </form>


        <!-- LOGIN LINK -->

        <p class="auth-bottom">

            <span data-i18n="already_registered">
                Already registered?
            </span>

            <a href="/login" data-i18n="login_here">
                Login here
            </a>

        </p>

    </div>

</section>

{% endblock %}
